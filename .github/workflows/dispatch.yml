name: dispatch

# This repository does not release. trebi-pro owns tags and releases, so a
# green main here must tell trebi-pro to cut one. trebi-pro builds this exact
# commit and tags it on this repository after its builds pass.
#
# The dispatch must be loud. A lost dispatch means this commit ships only with
# the next core commit.
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: dispatch
  cancel-in-progress: false

jobs:
  gate:
    uses: ./.github/workflows/check.yml

  dispatch:
    needs: [gate]
    if: github.repository == 'trebi-ai/trebi'
    environment: release
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Mint a trebi-pro dispatch token
        id: app
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: "Iv23liHamBzMshOMTWIG"
          private-key: ${{ secrets.GH_APP_SECRET }}
          owner: trebi-ai
          repositories: trebi-pro
      - name: Tell trebi-pro to release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api --method POST repos/trebi-ai/trebi-pro/dispatches --input - <<EOF
          {"event_type":"core-commit","client_payload":{"sha":"${SHA}"}}
          EOF
          echo "dispatched core-commit for $SHA"
