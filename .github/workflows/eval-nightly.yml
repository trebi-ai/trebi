name: eval-nightly

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  eval:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: run suite
        env:
          TREBI_BIN: ${{ github.workspace }}/build/trebi
        run: scripts/eval.sh run --budget 50
      - name: upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: out/
