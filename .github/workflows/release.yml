name: release

# Tagging and releasing. The gate runs as the first job (check.yml is the
# reusable workflow), so only tested commits publish. A push to main starts
# one release run; the next push waits for it to finish, so its candidate
# version is computed after the previous tag exists.
#
# Asset names are ownership. This pipeline owns trebi-free_* and
# SHA256SUMS-free. trebi-pro owns trebi_* and SHA256SUMS on the same release.
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    uses: ./.github/workflows/check.yml

  version:
    needs: [gate]
    if: github.repository == 'trebi-ai/trebi'
    runs-on: ubuntu-latest
    outputs:
      candidate: ${{ steps.version.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute the candidate version
        id: version
        run: |
          set -euo pipefail
          latest="$(git tag --list 'v[0-9]*' --sort=-v:refname)"
          latest="${latest%%$'\n'*}"
          if [[ -z "$latest" ]]; then
            candidate="0.1.0"
          else
            core="${latest#v}"
            core="${core%%-*}"
            IFS=. read -r major minor patch <<<"$core"
            candidate="$major.$minor.$((patch + 1))"
          fi
          echo "candidate=$candidate" >>"$GITHUB_OUTPUT"
          echo "candidate $candidate (from ${latest:-no tag})"

  plain:
    needs: [version]
    if: github.repository == 'trebi-ai/trebi'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, goos: linux, goarch: amd64 }
          - { os: ubuntu-latest, goos: linux, goarch: arm64 }
          - { os: macos-latest, goos: darwin, goarch: arm64 }
          - { os: macos-latest, goos: darwin, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.goos == 'darwin' && '1' || '0' }}
          VERSION: ${{ needs.version.outputs.candidate }}
        run: |
          set -euo pipefail
          # The tray needs cgo; an amd64 build on an arm64 runner targets
          # x86_64 explicitly.
          if [[ "$GOOS" == darwin && "$GOARCH" == amd64 ]]; then
            export CC="clang -arch x86_64"
          fi
          go build \
            -ldflags "-X github.com/trebi-ai/trebi/internal/api.Version=$VERSION" \
            -o "trebi-free_${VERSION}_${GOOS}_${GOARCH}" ./cmd/trebi
      - uses: actions/upload-artifact@v4
        with:
          name: trebi-free-${{ matrix.goos }}-${{ matrix.goarch }}
          path: trebi-free_${{ needs.version.outputs.candidate }}_${{ matrix.goos }}_${{ matrix.goarch }}
          if-no-files-found: error

  # The only job that reaches into the private trebi-ui repository. It runs
  # only on a push to the canonical repository and only inside the `release`
  # environment, so a fork PR can never see the App credential.
  ui:
    needs: [version]
    if: github.repository == 'trebi-ai/trebi'
    environment: release
    runs-on: ${{ matrix.os }}
    outputs:
      ui_version: ${{ steps.resolve.outputs.ui_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, goos: linux, goarch: amd64 }
          - { os: ubuntu-latest, goos: linux, goarch: arm64 }
          - { os: macos-latest, goos: darwin, goarch: arm64 }
          - { os: macos-latest, goos: darwin, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Mint a trebi-ui read token
        id: app
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: "Iv23liHamBzMshOMTWIG"
          private-key: ${{ secrets.GH_APP_SECRET }}
          owner: trebi-ai
          repositories: trebi-ui
      - name: Resolve the newest trebi-ui release
        id: resolve
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ needs.version.outputs.candidate }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ui" internal/ui/dist
          tag="$(gh release list --repo trebi-ai/trebi-ui --limit 1 --json tagName --jq '.[0].tagName // ""')"
          if [[ -z "$tag" ]]; then
            echo "::error::no trebi-ui release to embed; cut one before releasing trebi"
            echo "repositories visible to the installation token:"
            gh api /installation/repositories --jq '[.repositories[].full_name]' || true
            exit 1
          fi
          if ! gh release download "$tag" --repo trebi-ai/trebi-ui \
            --pattern 'trebi-ui-*.tar.gz' --dir "$RUNNER_TEMP/ui"; then
            echo "::error::could not download the trebi-ui $tag tarball"
            gh release view "$tag" --repo trebi-ai/trebi-ui --json tagName,assets --jq '{tagName, assets: [.assets[].name]}' || true
            exit 1
          fi
          tar -xzf "$RUNNER_TEMP/ui"/trebi-ui-*.tar.gz -C internal/ui/dist
          ui_version="$(jq -r '.ui_version' internal/ui/dist/manifest.json)"
          min_version="$(jq -r '.min_daemon_version' internal/ui/dist/manifest.json)"
          if [[ -z "$ui_version" || "$ui_version" == null ]]; then
            echo "::error::the trebi-ui release manifest has no ui_version"
            exit 1
          fi
          if ! scripts/semver-ge.sh "$VERSION" "$min_version"; then
            echo "::error::daemon $VERSION is older than the UI minimum $min_version"
            exit 1
          fi
          echo "ui_version=$ui_version" >>"$GITHUB_OUTPUT"
          echo "embedding trebi-ui $ui_version (min daemon $min_version) from $tag"
      - name: Build with the embedded UI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.goos == 'darwin' && '1' || '0' }}
          VERSION: ${{ needs.version.outputs.candidate }}
          UI_VERSION: ${{ steps.resolve.outputs.ui_version }}
        run: |
          set -euo pipefail
          if [[ "$GOOS" == darwin && "$GOARCH" == amd64 ]]; then
            export CC="clang -arch x86_64"
          fi
          go build -tags ui \
            -ldflags "-X github.com/trebi-ai/trebi/internal/api.Version=$VERSION -X github.com/trebi-ai/trebi/internal/api.UIVersion=$UI_VERSION" \
            -o "trebi-free-ui_${VERSION}_${GOOS}_${GOARCH}" ./cmd/trebi
      - uses: actions/upload-artifact@v4
        with:
          name: trebi-free-ui-${{ matrix.goos }}-${{ matrix.goarch }}
          path: trebi-free-ui_${{ needs.version.outputs.candidate }}_${{ matrix.goos }}_${{ matrix.goarch }}
          if-no-files-found: error

  publish:
    needs: [version, plain, ui]
    if: github.repository == 'trebi-ai/trebi'
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum * >SHA256SUMS-free
          cat SHA256SUMS-free
      - name: Push the tag and create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.candidate }}
          UI_VERSION: ${{ needs.ui.outputs.ui_version }}
        run: |
          set -euo pipefail
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --verify-tag --latest=false --title "v$VERSION" \
            --generate-notes --notes "Embedded UI: trebi-ui $UI_VERSION" \
            dist/*
      - name: Mint a trebi-pro dispatch token
        id: dispatch
        continue-on-error: true
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: "Iv23liHamBzMshOMTWIG"
          private-key: ${{ secrets.GH_APP_SECRET }}
          owner: trebi-ai
          repositories: trebi-pro
      - name: Dispatch trebi-pro
        if: steps.dispatch.outputs.token != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.dispatch.outputs.token }}
          VERSION: ${{ needs.version.outputs.candidate }}
        run: |
          set -euo pipefail
          gh api --method POST repos/trebi-ai/trebi-pro/dispatches --input - <<EOF
          {"event_type":"core-release","client_payload":{"tag":"v${VERSION}"}}
          EOF
