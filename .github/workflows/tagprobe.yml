name: tagprobe
on:
  workflow_dispatch:
    inputs:
      sha:
        required: true
      tag:
        required: true
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SHA" --draft --title "$TAG" --notes probe && echo OK || echo REFUSED
