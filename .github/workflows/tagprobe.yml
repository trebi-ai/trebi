name: tagprobe
on:
  workflow_dispatch:
    inputs:
      sha:
        required: true
      tag:
        required: true
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
          TAG: ${{ inputs.tag }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" && echo OK || echo REFUSED
