name: check

# The gate. This repository does not release: trebi-pro tags the version and
# creates the release on this repository (see ../CLAUDE.md).
#
# On main the gate runs inside dispatch.yml, which calls this workflow, so a
# push to main is excluded here and does not run it twice. Tags are excluded
# too: trebi-pro tags a commit this gate already passed.
on:
  push:
    branches-ignore: [main]
    tags-ignore: ["**"]
  pull_request:
  workflow_call:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Plain tests on Linux. The race jobs below run in parallel with this job.
  test:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    env:
      TREBI_TEST_SCALE: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # The self-hosted runners keep the module cache on disk; uploading
          # it as an Actions cache takes longer than the build.
          cache: false
      # .github/quarantine lists one test-name regex per line. See CLAUDE.md.
      - name: go test
        run: |
          skip=$(grep -v '^[[:space:]]*$' .github/quarantine | paste -sd'|' - || true)
          args=()
          [ -n "$skip" ] && args=(-skip "$skip")
          go test "${args[@]}" ./...
      - name: go vet public packages
        run: go vet ./app/... ./ext/...

  # These packages start goroutines of their own. The shards run in parallel,
  # so a rerun of failed jobs repeats only the shard that failed. Run them on
  # mini. A fork PR runs them on mpc. The repository variable
  # TREBI_RACE_RUNS_ON (a JSON array of labels) overrides the default.
  # On mini (2026-11-18): daemon 5.2 min, other 2.1 min. On mpc: about 14 and 20.
  race:
    name: race (${{ matrix.shard }})
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '["self-hosted","Linux","X64"]' || vars.TREBI_RACE_RUNS_ON || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: daemon
            pkgs: ./internal/daemon
          - shard: other
            pkgs: ./internal/connectors ./internal/channels ./internal/dispatch ./internal/cloudlink ./internal/relay ./internal/mobile
    env:
      CGO_ENABLED: "1"
      TREBI_TEST_SCALE: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: go test -race
        env:
          PKGS: ${{ matrix.pkgs }}
        run: |
          skip=$(grep -v '^[[:space:]]*$' .github/quarantine | paste -sd'|' - || true)
          args=()
          [ -n "$skip" ] && args=(-skip "$skip")
          # shellcheck disable=SC2086
          go test -race -timeout 20m "${args[@]}" $PKGS

  lint:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: --new-from-merge-base needs the merge base with origin/main.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # The self-hosted runners keep the module cache on disk; uploading
          # it as an Actions cache takes longer than the build.
          cache: false
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13
          args: --new-from-merge-base=origin/main ./...

  # The ui build tag embeds internal/ui/dist, which is git-ignored. The
  # committed fixture makes this runnable on every push and on fork PRs with
  # no secret and no network. See docs/plans/2026-09-18-release-versioning.md.
  tagged-build:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # The self-hosted runners keep the module cache on disk; uploading
          # it as an Actions cache takes longer than the build.
          cache: false
      - name: Stage the fixture dist
        run: |
          mkdir -p internal/ui/dist
          cp -R internal/ui/testdata/dist/. internal/ui/dist/
      - name: go build -tags ui
        run: go build -tags ui ./cmd/trebi
      - name: go test -tags ui
        run: go test -tags ui ./internal/ui/... ./internal/api/...
