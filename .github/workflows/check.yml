name: check

# The gate. This repository does not release: trebi-pro tags the version and
# creates the release on this repository (see ../CLAUDE.md).
#
# On main the gate runs inside dispatch.yml, which calls this workflow, so a
# push to main is excluded here and does not run it twice. Tags are excluded
# too: trebi-pro tags a commit this gate already passed.
on:
  push:
    branches-ignore: [main]
    tags-ignore: ["**"]
  pull_request:
  workflow_call:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # The self-hosted runners keep the module cache on disk; uploading
          # it as an Actions cache takes longer than the build.
          cache: false
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: semver-ge tests
        run: bash scripts/semver-ge.test.sh
      - name: go test
        run: go test ./...
      # These packages start goroutines of their own. About 90 s on an M-series Mac.
      - name: go test -race
        env:
          CGO_ENABLED: "1"
        run: go test -race ./internal/connectors ./internal/channels ./internal/dispatch ./internal/daemon
      - name: go vet public packages
        run: go vet ./app/... ./ext/...

  lint:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch main for merge-base lint
        run: git fetch --depth=1 origin main
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # The self-hosted runners keep the module cache on disk; uploading
          # it as an Actions cache takes longer than the build.
          cache: false
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13
          args: --new-from-merge-base=origin/main ./...

  # The ui build tag embeds internal/ui/dist, which is git-ignored. The
  # committed fixture makes this runnable on every push and on fork PRs with
  # no secret and no network. See docs/plans/2026-09-18-release-versioning.md.
  tagged-build:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # The self-hosted runners keep the module cache on disk; uploading
          # it as an Actions cache takes longer than the build.
          cache: false
      - name: Stage the fixture dist
        run: |
          mkdir -p internal/ui/dist
          cp -R internal/ui/testdata/dist/. internal/ui/dist/
      - name: go build -tags ui
        run: go build -tags ui ./cmd/trebi
      - name: go test -tags ui
        run: go test -tags ui ./internal/ui/... ./internal/api/...
