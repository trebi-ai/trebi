name: tag

# trebi-pro owns the version series but cannot cut the tag here. The REST ref
# API refuses every integration token on this repository (403), while a git
# push with the same token is accepted. So trebi-pro asks, and this workflow
# pushes the tag with git.
#
# The payload names the version and the commit. The commit must already be on
# main; this workflow never creates one.
on:
  repository_dispatch:
    types: [cut-tag]

jobs:
  tag:
    if: github.repository == 'trebi-ai/trebi'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.client_payload.sha }}
          fetch-depth: 0
      - name: Push the tag
        env:
          VERSION: ${{ github.event.client_payload.version }}
          SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::bad version '$VERSION'" >&2; exit 1 ;;
          esac
          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "$tag" >/dev/null 2>&1; then
            echo "$tag exists"
            exit 0
          fi
          git tag "$tag" "$SHA"
          git push origin "refs/tags/$tag"
          echo "tagged $tag at $SHA"
