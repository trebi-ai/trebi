schema: trebi-connector/1
name: github-mcp
title: GitHub
description: GitHub tools over MCP.
version: 0.9.0
setup:
  inputs:
    - {name: GITHUB_TOKEN, label: Access token, secret: true, required: true}
actions:
  mcp:
    url: https://api.githubcopilot.com/mcp/
    headers: {Authorization: "Bearer ${GITHUB_TOKEN}"}
