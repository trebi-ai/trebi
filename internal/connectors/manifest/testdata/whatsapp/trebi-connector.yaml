schema: trebi-connector/1
name: whatsapp
title: WhatsApp
description: Send and receive WhatsApp messages from your own account.
icon: icon.svg
version: 1.3.0
publisher: trebi
source: github.com/trebi-ai/trebi-connectors
homepage: https://trebi.ai/connectors/whatsapp
license: MIT
warning: Uses the WhatsApp Web protocol. WhatsApp can ban an account that uses it.
platforms: [darwin/arm64, darwin/amd64, linux/arm64, linux/amd64]
install:
  github_release:
    repo: trebi-ai/trebi-connectors
    tag: channels/whatsapp-cli/v{version}
    asset: whatsapp-cli_{version}_{os}_{arch}.tar.gz
    checksums: SHA256SUMS
  go: github.com/trebi-ai/trebi-connectors/channels/whatsapp-cli@v{version}
  bin: whatsapp-cli
  version_command: whatsapp-cli --version
setup:
  login: [qr]
skill:
  compat: ">=1.3 <2"
actions:
  cli: {commands: [whatsapp-cli]}
events:
  protocol: trebi-connector/1
  command: whatsapp-cli serve
  restart: always
  types:
    - {type: message, description: A new message in a room, schema: schemas/message.json}
    - {type: reaction, description: A reaction on a message}
channel:
  features: [rooms.list, rooms.open, history, replay, typing, seen, reactions, attachments.in, attachments.out]
  limits: {max_text: 65536, formats: [text]}
