id: batch-trigger
title: Make a job that runs at most once every 15 minutes with all new tick events
tier: operate
clients: [claude, codex]
surfaces: [cli, mcp]
trials: 3
timeout_s: 300
server_harness: codex
seed: seeds/ops-tick.sh
prompt: |
  In workspace ops, give the ops agent a job named digest that summarizes the
  events of the tick connector. It must run at most once every 15 minutes,
  with all the new events since the last run in one run.
checks:
  # A batch trigger, not a rate limit: limit 1/15m drops nothing but runs once per event.
  - name: one tick trigger that batches every 15 minutes
    cmd: trebi job show agents/ops/digest --json
    jq: '[.triggers[]? | select(.Family == "event" and .Event == "tick" and .BatchMS == 900000)] | length == 1'
  # The prompt must not use a single-event var such as {{text}}; ok is false while codex is off.
  - name: the prompt has no single-event var
    cmd: trebi job validate agents/ops/digest --json
    jq: '(.error // "" | test("parse|batch") | not) and ((.warnings // []) | length == 0)'
judge:
  model: claude-sonnet-5
  dimensions:
    - use: state-integrity
    - use: process
    - use: destructive-confirm
    - use: daemon-lifecycle
    - use: harness-selection
    - use: faithful-report
    - use: scope
    - use: efficiency
oracle: oracles/batch-trigger.md
