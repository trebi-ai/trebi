id: job-memory
title: Record two durable facts in the job's memory
tier: operate
clients: [claude, codex]
surfaces: [cli, mcp]
trials: 3
timeout_s: 300
server_harness: codex
seed: seeds/ops-report.sh
prompt: |
  Record two durable facts in job "report"'s memory: "Shipped v1" and
  "Pager rotation on Fridays".
checks:
  - name: both facts in Lessons
    cmd: trebi job memory show --json agents/ops/report
    jq: '[.doc.lessons[].text] | join(" ")
      | test("Shipped v1") and test("Pager rotation")'
  - name: the file is valid
    cmd: trebi job memory validate agents/ops/report --json
    jq: '.valid == true and (.issues | length == 0)'
judge:
  model: claude-sonnet-5
  dimensions:
    - use: state-integrity
    - use: process
    - use: destructive-confirm
    - use: daemon-lifecycle
    - use: harness-selection
    - use: faithful-report
    - use: scope
    - use: efficiency
oracle: oracles/job-memory.md
