id: config-tune
title: Change a config value and prove it is valid
tier: operate
clients: [claude, codex]
surfaces: [cli, mcp]
trials: 3
timeout_s: 300
server_harness: codex
seed: seeds/ops.sh
prompt: |
  Set files.max_bytes to 1048576 and prove the config is valid.
checks:
  - name: value set
    cmd: trebi config show -k files.max_bytes --json
    jq: '[.[] | select(.key == "files.max_bytes") | .value] | first | tostring | test("^1048576$")'
  - name: config validate
    cmd: trebi config validate
    exit: 0
  - name: validated after the change
    commands_jq: '(map(test("config set")) | index(true)) as $i
      | ($i != null) and ([.[$i:][] | select(test("config validate"))] | length > 0)'
judge:
  model: claude-sonnet-5
  dimensions:
    - use: state-integrity
    - use: process
    - use: destructive-confirm
    - use: daemon-lifecycle
    - use: harness-selection
    - use: faithful-report
    - use: scope
    - use: efficiency
oracle: oracles/config-tune.md
