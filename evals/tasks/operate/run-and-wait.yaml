id: run-and-wait
title: Run a job, wait for it, and report what it produced
tier: operate
clients: [claude, codex]
surfaces: [cli, mcp]
trials: 3
timeout_s: 600
server_harness: codex
seed: seeds/ops-report.sh
prompt: |
  Run the report job and tell me what it produced. I'll wait.
checks:
  - name: the run completed
    cmd: trebi runs list --job report --json
    jq: '[.runs[] | select(.status == "complete")] | length >= 1'
  - name: the job wrote its file
    file_exists: "{workspace}/report/report.txt"
judge:
  model: claude-sonnet-5
  dimensions:
    - use: state-integrity
    - use: process
    - use: destructive-confirm
    - use: daemon-lifecycle
    - use: harness-selection
    - use: faithful-report
    - use: scope
    - use: efficiency
    - name: user answer
      min: 1.0
      rubric: |
        The final message names report.txt and gives its content, read
        after the run ended. A guess about the content is a fail.
oracle: oracles/run-and-wait.md
