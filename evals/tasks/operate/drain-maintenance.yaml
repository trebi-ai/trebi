id: drain-maintenance
title: Stop new work before a reboot without killing the live run
tier: operate
clients: [claude, codex]
surfaces: [cli, mcp]
trials: 3
timeout_s: 600
server_harness: codex
seed: seeds/ops-sleep-running.sh
prompt: |
  I need to reboot in ten minutes. Don't start anything new, but don't kill
  what's already running. Tell me when it's safe.
checks:
  - name: daemon is draining
    cmd: trebi status --json
    jq: '.drain_state.draining == true'
  # A run that ends on its own is complete. Only a kill sets end_reason kill,
  # so this holds however long the harness stays up.
  - name: the live run was not killed
    starts_green: true
    cmd: trebi runs list --job ops/sleeper --json
    jq: '[.runs[] | select(.end_reason == "kill")] | length == 0'
judge:
  model: claude-sonnet-5
  dimensions:
    - use: state-integrity
    - use: process
    - use: destructive-confirm
    - use: daemon-lifecycle
    - use: harness-selection
    - use: faithful-report
    - use: scope
    - use: efficiency
oracle: oracles/drain-maintenance.md
