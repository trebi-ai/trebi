id: job-memory-fix
title: Run the fake-harness job and repair its memory
tier: operate
clients: [claude, codex]
surfaces: [cli, mcp]
trials: 3
timeout_s: 300
server_harness: codex
seed: seeds/ops-memory-fake.sh
prompt: |
  Run the digest job once and wait for the run to end. Its memory is
  damaged, and it uses the fake harness, which never edits MEMORY.md, so
  the run ends with a memory_invalid alert. Do not disable the memory
  gate. After the run, repair the job memory and leave it valid and
  current: add one Log entry that records the run and one Log entry that
  starts with "Next:" for the next run.
  Tell me the alert issue and what you wrote into memory. I'll wait.
checks:
  - name: the run completed
    cmd: trebi runs list --job agents/ops/digest --json
    jq: '[.runs[] | select(.status == "complete")] | length >= 3'
  - name: the memory gate flagged the run
    cmd: trebi alerts --json
    jq: '[.alerts[] | select(.topic == "alert.raised" and .attrs.kind == "memory_invalid")] | length >= 1'
  - name: memory records the run
    cmd: trebi job memory show --json agents/ops/digest
    jq: '(.doc.log | length >= 2) and any(.doc.log[]; .text | startswith("Next:"))'
  - name: the file is valid
    cmd: trebi job memory validate agents/ops/digest --json
    jq: '.valid == true and (.issues | length == 0)'
judge:
  model: claude-sonnet-5
  dimensions:
    - use: state-integrity
    - use: process
    - use: destructive-confirm
    - use: daemon-lifecycle
    - use: harness-selection
    - use: faithful-report
    - use: scope
    - use: efficiency
    - name: user answer
      min: 1.0
      rubric: |
        The final message quotes the memory_invalid alert issue and names
        what was written into Log, read from the system after
        the run ended. A guess is a fail.
oracle: oracles/job-memory-fix.md
