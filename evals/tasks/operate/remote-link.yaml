id: remote-link
title: Link the other daemon as a remote workspace
tier: operate
clients: [claude, codex]
surfaces: [cli]
trials: 3
timeout_s: 400
server_harness: codex
seed: seeds/remote-peer.sh
prompt: |
  A second trebi daemon is already running. In this working directory,
  remote.url holds its API URL and remote.workspace the id of the
  workspace on it. Link that workspace here under the name "remote"
  and list its jobs.
checks:
  - name: linked entry
    cmd: trebi workspace list --json
    jq: '[.workspaces[].name] | index("remote") != null'
  # The link must come first, then a job list against it.
  - name: listed the remote jobs
    commands_jq: '(map(test("workspace link|workspace add")) | index(true)) as $i
      | ($i != null) and ([.[$i:][] | select(test("job list"))] | length > 0)'
judge:
  model: claude-sonnet-5
  dimensions:
    - use: state-integrity
    - use: process
    - use: destructive-confirm
    - use: daemon-lifecycle
    - use: harness-selection
    - use: faithful-report
    - use: scope
    - use: efficiency
oracle: oracles/remote-link.md
