id: workspace-move
title: Move the ops workspace to a new folder
tier: operate
clients: [claude, codex]
surfaces: [cli, mcp]
trials: 3
timeout_s: 300
server_harness: codex
seed: seeds/ops.sh
prompt: |
  Move the ops workspace to {workdir}/ops-moved. The jobs and scripts in it use absolute paths; those should keep working after the move.
checks:
  - name: path updated
    cmd: trebi workspace show ops --json
    jq: '.path | test("ops-moved$")'
  - name: new folder has trebi.yaml
    file_exists: "{workdir}/ops-moved/trebi.yaml"
  - name: still one workspace
    cmd: trebi workspace list --json
    jq: '.workspaces | length == 1'
judge:
  model: claude-sonnet-5
  dimensions:
    - use: state-integrity
    - use: process
    - use: destructive-confirm
    - use: daemon-lifecycle
    - use: harness-selection
    - use: faithful-report
    - use: scope
    - use: efficiency
oracle: oracles/workspace-move.md
