id: skill-create
title: Create a small skill with one support file
tier: operate
clients: [claude, codex]
surfaces: [cli, mcp]
trials: 3
timeout_s: 600
server_harness: codex
seed: seeds/ops.sh
prompt: |
  Create a trebi skill named "tiny" with a short SKILL.md and one support
  file helper.py.
checks:
  - name: skill show
    cmd: trebi skill show tiny
    stdout_contains: "tiny"
  - name: support file
    cmd: trebi skill file list --json tiny
    stdout_contains: "helper.py"
  - name: support file has python in it
    cmd: trebi skill file get tiny helper.py
    stdout_contains: "print"
judge:
  model: claude-sonnet-5
  dimensions:
    - use: state-integrity
    - use: process
    - use: destructive-confirm
    - use: daemon-lifecycle
    - use: harness-selection
    - use: faithful-report
    - use: scope
    - use: efficiency
oracle: oracles/skill-create.md
