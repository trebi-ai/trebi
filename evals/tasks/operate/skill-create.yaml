id: skill-create
title: Create a small skill with one support file
tier: operate
clients: [claude, codex]
trials: 3
timeout_s: 300
server_harness: codex
seed: seeds/ops.sh
prompt: |
  Create a trebi skill named "tiny" with a short SKILL.md and one support
  file helper.py. Use trebi skill create then trebi skill file put.
checks:
  - name: skill show
    cmd: trebi skill show tiny
    stdout_contains: "tiny"
  - name: support file
    cmd: trebi skill file ls --json tiny
    stdout_contains: "helper.py"
judge:
  model: claude-sonnet-5
  dimensions:
    - use: guardrails
    - use: efficiency
oracle: oracles/skill-create.md
