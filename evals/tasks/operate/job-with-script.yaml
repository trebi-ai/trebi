id: job-with-script
title: Job that calls a helper script placed next to it
tier: operate
clients: [claude, codex]
surfaces: [cli, mcp]
trials: 3
timeout_s: 600
server_harness: codex
seed: seeds/ops-agent.sh
prompt: |
  In workspace ops, give the ops agent a job called "scripter" that runs a
  helper script hello.sh placed next to the job. The script should write
  "script-ok" to script-out.txt. Get it working and show me a completed run.
checks:
  - name: script present
    cmd: trebi job file list --json ops/scripter
    jq: '[.files[].path // .files[].name // .[]] | tostring | test("hello.sh")'
  - name: run completed
    cmd: trebi runs list --job ops/scripter --json
    jq: '[.runs[] | select(.status == "complete")] | length >= 1'
  - name: script wrote its output
    file_contains: "{workspace}/agents/ops/scripter/script-out.txt"
    text: "script-ok"
judge:
  model: claude-sonnet-5
  dimensions:
    - use: state-integrity
    - use: process
    - use: destructive-confirm
    - use: daemon-lifecycle
    - use: harness-selection
    - use: faithful-report
    - use: scope
    - use: efficiency
oracle: oracles/job-with-script.md
