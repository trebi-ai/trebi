id: job-schedule
title: Put report on a daily 07:00 schedule, then pause it
tier: operate
clients: [claude, codex]
surfaces: [cli, mcp]
trials: 3
timeout_s: 300
server_harness: codex
seed: seeds/ops-report.sh
prompt: |
  Job "report" already exists in workspace ops. Put it on a daily 07:00
  schedule, then pause it.
checks:
  # Accept any daily-07:00 spelling; reject a weekly or an off-hour cron.
  - name: daily 07:00 trigger
    cmd: trebi job show agents/ops/report --json
    jq: '[.triggers[]? | select(.Family == "cron") | .Cron | gsub("\\s+"; " ")]
      | any(test("^0 7 (\\*|\\?) (\\*|\\?) (\\*|\\?)$"))'
  - name: job disabled
    cmd: trebi job show agents/ops/report --json
    jq: '.active == false'
judge:
  model: claude-sonnet-5
  dimensions:
    - use: state-integrity
    - use: process
    - use: destructive-confirm
    - use: daemon-lifecycle
    - use: harness-selection
    - use: faithful-report
    - use: scope
    - use: efficiency
oracle: oracles/job-schedule.md
