id: agent-create-wake
title: Create an agent, wake it, and report what it did
tier: operate
clients: [claude, codex]
surfaces: [cli, mcp]
trials: 3
timeout_s: 600
server_harness: codex
seed: seeds/ops.sh
prompt: |
  Create a trebi agent named cmo that watches growth, wake it once, and
  tell me what it did. I'll wait.
checks:
  - name: the agent exists
    cmd: trebi agent list --json
    jq: '[.agents[] | select(.name == "cmo")] | length == 1'
  - name: an agent-kind run exists
    cmd: trebi runs list --kind agent --json
    jq: '[.runs[] | select(.kind == "agent")] | length >= 1'
judge:
  model: claude-sonnet-5
  dimensions:
    - use: state-integrity
    - use: process
    - use: destructive-confirm
    - use: daemon-lifecycle
    - use: harness-selection
    - use: faithful-report
    - use: scope
    - use: efficiency
    - name: user answer
      min: 1.0
      rubric: |
        The final message says what the agent run did, read from the run
        output after it ended. A guess is a fail.
oracle: oracles/agent-create-wake.md
