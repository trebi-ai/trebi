id: harness-login
title: Log a harness in with a device code
tier: onboarding
clients: [claude, codex]
surfaces: [cli, mcp]
trials: 3
timeout_s: 500
server_harness: codex
prompt: |
  The fake AI tool isn't logged in. Log it in; the code is 1234.
checks:
  - name: fake is logged in
    cmd: trebi harness auth status fake --json
    jq: '[.[] | select(.name == "fake") | .auth_status] | index("ok") != null'
  - name: no attach
    commands_jq: 'all(.[]; test("--attach|attach ") | not)'
judge:
  model: claude-sonnet-5
  dimensions:
    - use: state-integrity
    - use: process
    - use: destructive-confirm
    - use: daemon-lifecycle
    - use: harness-selection
    - use: faithful-report
    - use: scope
    - use: efficiency
oracle: oracles/harness-login.md
