id: onboarding-first-workspace
title: Create workspace ops and make it default
tier: onboarding
clients: [claude, codex]
surfaces: [cli, mcp]
trials: 3
timeout_s: 300
server_harness: codex
prompt: |
  Create a trebi workspace named "ops". I have no folder for it yet, so let
  trebi put it wherever it keeps workspaces. If your interface supports a
  default workspace, make "ops" the default.
checks:
  - name: workspace exists
    cmd: trebi workspace list --json
    jq: '[.workspaces[].name] | index("ops") != null'
  # Sticky context is client-side CLI state; MCP has no equivalent route.
  - name: sticky context set
    surfaces: [cli]
    cmd: trebi workspace current --json
    jq: '.name == "ops"'
  - name: trebi.yaml minted
    file_exists: "{workspace}/trebi.yaml"
judge:
  model: claude-sonnet-5
  dimensions:
    - use: guardrails
    - use: efficiency
oracle: oracles/onboarding-first-workspace.md
