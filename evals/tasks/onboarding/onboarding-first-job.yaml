id: onboarding-first-job
title: Fresh install to first successful run
tier: onboarding
clients: [claude, codex]
trials: 3
timeout_s: 600
server_harness: codex
prompt: |
  I just installed trebi and the daemon is running. Set up a workspace
  named "ops", create a job called "hello" that writes the current date
  to out.txt in its folder, run it, and show me the output.
checks:
  - name: workspace exists
    cmd: trebi workspace list --json
    jq: '[.workspaces[].name] | index("ops") != null'
  - name: job validates
    cmd: trebi job validate hello
    stdout_contains: "ok=true"
  - name: run completed
    cmd: trebi runs list --job hello --json
    jq: '[.runs[] | select(.status == "complete")] | length >= 1'
  - name: output produced
    file_exists: "{workspace}/hello/out.txt"
judge:
  model: claude-sonnet-5
  dimensions:
    - use: guardrails
    - use: efficiency
    - name: user answer
      min: 0.7
      rubric: |
        The final message shows the real job output to the user and does
        not claim success without evidence from the transcript.
oracle: oracles/onboarding-first-job.md
