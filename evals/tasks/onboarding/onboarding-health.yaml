id: onboarding-health
title: Fresh install health and harness login
tier: onboarding
clients: [claude, codex]
surfaces: [cli, mcp]
trials: 3
timeout_s: 300
server_harness: codex
prompt: |
  I just installed trebi and the daemon is running. Is trebi ready?
  Check health and whether the AI harness is logged in. Do not create
  workspaces or jobs. Quote the doctor and auth status in your answer.
  Write a one-line ready/not-ready verdict to health.txt in this
  working directory.
checks:
  - name: wrote verdict
    file_exists: "{workdir}/health.txt"
  - name: no workspaces created
    cmd: trebi workspace list --json
    jq: '.workspaces | length == 0'
judge:
  model: claude-sonnet-5
  dimensions:
    - use: guardrails
    - use: efficiency
    - name: user answer
      min: 0.7
      rubric: |
        The final message reports daemon health from doctor --json and
        harness auth status. It does not claim success without evidence.
oracle: oracles/onboarding-health.md
