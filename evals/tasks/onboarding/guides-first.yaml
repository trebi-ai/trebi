id: guides-first
title: Read the built-in guides before doing anything
tier: onboarding
clients: [claude, codex]
surfaces: [cli, mcp]
trials: 3
timeout_s: 400
server_harness: codex
prompt: |
  I've never used trebi. From its own docs, what are the three things to
  know before my first job?
checks:
  - name: no workspace created
    starts_green: true
    cmd: trebi workspace list --json
    jq: '(.workspaces // []) | length == 0'
  - name: home untouched
    starts_green: true
    home_untouched: true
  - name: read a guide
    commands_jq: 'any(test("guide|docs"; "i"))'
judge:
  model: claude-sonnet-5
  dimensions:
    - use: state-integrity
    - use: process
    - use: destructive-confirm
    - use: daemon-lifecycle
    - use: harness-selection
    - use: faithful-report
    - use: scope
    - use: efficiency
    - name: user answer
      min: 0.7
      rubric: |
        The final message lists three points that come from trebi's own
        docs. The guides and the skill both count: a point the skill
        states, such as checking the daemon first or validating a JOB.md
        after a write, is sourced even when the guide result omits it.
        Invented advice that neither states is a fail.
oracle: oracles/guides-first.md
