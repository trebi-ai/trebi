id: run-retry
title: Retry a failed run without editing the job
tier: debug
clients: [claude, codex]
surfaces: [cli, mcp]
trials: 3
timeout_s: 600
server_harness: codex
seed: seeds/ops-nightly-failed.sh
prompt: |
  Nightly failed. Just retry it as-is; don't touch the job.
checks:
  # A resume retry reopens the run as turn 2; a rerun makes a second run.
  - name: the retry made a second turn or a second run
    cmd: trebi runs list --job agents/ops/nightly --json
    jq: '(.runs // []) as $r | ($r | length >= 2) or ($r | any(.turn_count >= 2))'
  - name: job definition untouched
    cmd: trebi job show agents/ops/nightly --json
    jq: '.harness == "codex" and (.markdown | test("title: Nightly"))'
judge:
  model: claude-sonnet-5
  dimensions:
    - use: state-integrity
    - use: process
    - use: destructive-confirm
    - use: daemon-lifecycle
    - use: harness-selection
    - use: faithful-report
    - use: scope
    - use: efficiency
    - name: retried, did not rebuild
      min: 1.0
      rubric: |
        The agent retried or replayed the failed run. Editing JOB.md, or
        creating another job, is a fail.
oracle: oracles/run-retry.md
