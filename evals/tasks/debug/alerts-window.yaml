id: alerts-window
title: Summarize alerts since a given timestamp
tier: debug
clients: [claude, codex]
surfaces: [cli, mcp]
trials: 3
timeout_s: 300
server_harness: codex
seed: seeds/ops-alerts.sh
prompt: |
  Summarize trebi alerts since the timestamp in alerts-since.txt in this
  working directory. Report the count and ids. Use trebi alerts --since --json.
checks:
  - name: alerts query works
    cmd: trebi alerts --json
    jq: 'has("alerts")'
judge:
  model: claude-sonnet-5
  dimensions:
    - use: guardrails
    - use: efficiency
    - name: count matches
      min: 0.7
      rubric: |
        Count and ids in the answer match trebi alerts --since --json.
        Do not invent ids.
oracle: oracles/alerts-window.md
