id: alerts-window
title: Summarize alerts since a given timestamp
tier: debug
clients: [claude, codex]
surfaces: [cli, mcp]
trials: 3
timeout_s: 300
server_harness: codex
seed: seeds/ops-alerts.sh
prompt: |
  Summarize trebi alerts since the timestamp in alerts-since.txt in this
  working directory. Report the count and ids. Write the count and ids to
  alerts-summary.txt in this working directory.
checks:
  - name: wrote summary
    file_exists: "{workdir}/alerts-summary.txt"
  - name: two alerts in the window
    cmd: trebi alerts --json
    jq: '.alerts | length == 2'
judge:
  model: claude-sonnet-5
  dimensions:
    - use: state-integrity
    - use: process
    - use: destructive-confirm
    - use: daemon-lifecycle
    - use: harness-selection
    - use: faithful-report
    - use: scope
    - use: efficiency
    - name: count matches
      min: 0.7
      rubric: |
        The count and ids in the answer match the alerts the system reports
        for that window. The seed raises two. Do not invent ids.
oracle: oracles/alerts-window.md
