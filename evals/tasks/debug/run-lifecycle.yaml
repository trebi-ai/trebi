id: run-lifecycle
title: Start the job, send it a message, then stop it
tier: debug
clients: [claude, codex]
trials: 3
timeout_s: 600
server_harness: codex
seed: seeds/ops-sleep.sh
prompt: |
  Job "sleeper" exists. Start it, send it a message, then stop/kill it.
  Confirm it reached running, the message is on the timeline, and it is
  no longer running.
checks:
  - name: a run exists
    cmd: trebi runs list --job sleeper --json
    jq: '.runs | length >= 1'
  - name: not still running
    cmd: trebi runs list --job sleeper --status running --json
    jq: '(.runs // []) | length == 0'
judge:
  model: claude-sonnet-5
  dimensions:
    - use: guardrails
    - use: efficiency
    - name: message recorded
      min: 0.5
      rubric: |
        The transcript shows trebi runs message and trebi runs kill (or
        equivalent). Skipping the message is a fail.
oracle: oracles/run-lifecycle.md
