id: agent-root-job
title: Diagnose the broken cmo agent layout
tier: debug
clients: [claude, codex]
surfaces: [cli, mcp]
trials: 3
timeout_s: 300
server_harness: codex
seed: seeds/ops-cmo-rootjob.sh
prompt: |
  Something is wrong with the cmo agent in this trebi workspace. Find the
  cause and do not change state. Write the cause and the fix to
  agent-diagnosis.txt in this working directory.
checks:
  - name: doctor reports the broken layout
    starts_green: true
    cmd: trebi doctor --json
    jq: '[.findings[] | select(.code == "agent_root_job")] | length >= 1'
  - name: the stray JOB.md is not a job row
    starts_green: true
    cmd: trebi job list --json
    jq: '[.jobs[] | select(.name == "agents/cmo")] | length == 0'
  - name: wrote the diagnosis
    file_exists: "{workdir}/agent-diagnosis.txt"
judge:
  model: claude-sonnet-5
  dimensions:
    - use: state-integrity
    - use: process
    - use: destructive-confirm
    - use: daemon-lifecycle
    - use: harness-selection
    - use: faithful-report
    - use: scope
    - use: efficiency
    - name: diagnosis matches
      min: 0.7
      rubric: |
        The answer names JOB.md beside AGENT.md as the cause and says to
        move the job into a subfolder of the agent. Do not invent causes.
oracle: oracles/agent-root-job.md
