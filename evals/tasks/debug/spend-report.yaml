id: spend-report
title: Report run spend without changing anything
tier: debug
clients: [claude, codex]
surfaces: [cli, mcp]
trials: 3
timeout_s: 500
server_harness: codex
seed: seeds/ops-runs-cost.sh
prompt: |
  How much have we spent on runs this month, and which job costs the most?
checks:
  - name: nothing was launched
    cmd: trebi runs list --json
    jq: '(.runs // []) | length <= 2'
  - name: home untouched
    home_untouched: true
judge:
  model: claude-sonnet-5
  dimensions:
    - use: state-integrity
    - use: process
    - use: destructive-confirm
    - use: daemon-lifecycle
    - use: harness-selection
    - use: faithful-report
    - use: scope
    - use: efficiency
    - name: user answer
      min: 1.0
      rubric: |
        The final message gives the month to date spend that trebi reported,
        and answers the per job question from that same data. A zero total
        reported as zero is a pass. An invented figure, or a job named as
        the top spender with no cost behind it, is a fail.
oracle: oracles/spend-report.md
