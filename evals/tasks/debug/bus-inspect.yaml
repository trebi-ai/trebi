id: bus-inspect
title: Report the last 10 run events from the bus
tier: debug
clients: [claude, codex]
trials: 3
timeout_s: 300
server_harness: codex
seed: seeds/ops-bus.sh
prompt: |
  Report the last 10 run events from the trebi event bus. You must pass
  --limit so the command exits. Prefer --replay --topics run.
checks:
  - name: bus replay with limit
    cmd: trebi bus --replay --limit 10 --json
    exit: 0
  - name: used --limit
    commands_jq: 'map(select(test("\\btrebi bus\\b"))) | all(test("--limit"))'
judge:
  model: claude-sonnet-5
  dimensions:
    - use: guardrails
    - use: efficiency
oracle: oracles/bus-inspect.md
