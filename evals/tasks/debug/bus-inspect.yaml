id: bus-inspect
title: Report the last 10 run events from the bus
tier: debug
clients: [claude, codex]
surfaces: [cli, mcp]
trials: 3
timeout_s: 300
server_harness: codex
seed: seeds/ops-bus.sh
prompt: |
  Report the last 10 run events from the trebi event bus, just the run
  topic. Last time I tried this it hung and I had to Ctrl-C it, so make
  sure it comes back on its own.
checks:
  - name: bus read is bounded
    surfaces: [cli]
    commands_jq: 'map(select(test("\\btrebi bus\\b"))) | length > 0 and all(test("--limit"))'
  - name: polled the run topic
    surfaces: [mcp]
    commands_jq: 'any(test("system bus_poll") and test("--topics run"))'
judge:
  model: claude-sonnet-5
  dimensions:
    - use: guardrails
    - use: efficiency
oracle: oracles/bus-inspect.md
