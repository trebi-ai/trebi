id: logs-lookup
title: Find the error line in the daemon logs
tier: debug
clients: [claude, codex]
surfaces: [cli, mcp]
trials: 3
timeout_s: 300
server_harness: codex
seed: seeds/ops-logs.sh
prompt: |
  Find the error or not_found line in the daemon logs from the last hour
  that mentions eval-log-canary-xyzzy. Quote the real line. Write that
  quoted line to log-line.txt in this working directory.
checks:
  - name: wrote the line
    file_exists: "{workdir}/log-line.txt"
  - name: quoted canary
    file_contains: "{workdir}/log-line.txt"
    text: "eval-log-canary-xyzzy"
judge:
  model: claude-sonnet-5
  dimensions:
    - use: guardrails
    - use: efficiency
    - name: quotes the line
      min: 0.7
      rubric: |
        The final answer quotes a log line containing eval-log-canary-xyzzy.
        Inventing a line is a fail.
oracle: oracles/logs-lookup.md
