id: integration-cursor
title: Reset an integration cursor to replay from the start
tier: debug
clients: [claude, codex]
surfaces: [cli, mcp]
trials: 3
timeout_s: 400
server_harness: codex
seed: seeds/ops-cursor-advanced.sh
prompt: |
  tick missed events yesterday. Replay everything from the beginning.
checks:
  - name: cursor back at the start
    cmd: trebi integration cursor show tick --json
    jq: '(.last_event_id // "") == ""'
  - name: the integration is still set up
    cmd: trebi integration list --json
    jq: '[.integrations[]? | select(.name == "tick")] | length == 1'
judge:
  model: claude-sonnet-5
  dimensions:
    - use: state-integrity
    - use: process
    - use: destructive-confirm
    - use: daemon-lifecycle
    - use: harness-selection
    - use: faithful-report
    - use: scope
    - use: efficiency
oracle: oracles/integration-cursor.md
