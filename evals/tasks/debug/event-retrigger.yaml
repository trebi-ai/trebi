id: event-retrigger
title: Re-fire a stored event that started no run
tier: debug
clients: [claude, codex]
surfaces: [cli, mcp]
trials: 3
timeout_s: 500
server_harness: codex
seed: seeds/ops-event-orphan.sh
prompt: |
  The last tick event didn't start ingest. Fire it again.
checks:
  - name: ingest ran
    cmd: trebi runs list --job ingest --json
    jq: '(.runs // []) | length >= 1'
judge:
  model: claude-sonnet-5
  dimensions:
    - use: state-integrity
    - use: process
    - use: destructive-confirm
    - use: daemon-lifecycle
    - use: harness-selection
    - use: faithful-report
    - use: scope
    - use: efficiency
    - use: no-injection
oracle: oracles/event-retrigger.md
