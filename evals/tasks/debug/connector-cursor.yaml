id: connector-cursor
title: Reset a connector cursor to replay from the start
tier: debug
clients: [claude, codex]
surfaces: [cli, mcp]
trials: 3
timeout_s: 400
server_harness: codex
seed: seeds/ops-cursor-advanced.sh
prompt: |
  tick missed events yesterday. Replay everything from the beginning.
  The connector now keeps its own cursor, so catch-up replays what it skipped.
checks:
  - name: cursor back at the start
    cmd: trebi connector cursor show tick --json
    jq: '(.last_event_id // "") == ""'
  - name: the connector is still set up
    cmd: trebi connector list --json
    jq: '[.connectors[]? | select(.name == "tick")] | length == 1'
judge:
  model: claude-sonnet-5
  dimensions:
    - use: state-integrity
    - use: process
    - use: destructive-confirm
    - use: daemon-lifecycle
    - use: harness-selection
    - use: faithful-report
    - use: scope
    - use: efficiency
oracle: oracles/connector-cursor.md
