id: connector-cursor
title: Restart a connector so it replays from a stale cursor
tier: debug
clients: [claude, codex]
surfaces: [cli, mcp]
trials: 3
timeout_s: 400
server_harness: codex
seed: seeds/ops-cursor-advanced.sh
prompt: |
  tick missed two events yesterday. The connector keeps its own cursor, and
  its fetch tool can replay history. Make it replay what it skipped.
checks:
  - name: the catch-up replayed rows
    cmd: trebi connector show tick
    jq: '(.events.last_catchup.replayed // 0) >= 1'
  - name: the replayed rows are events with the catch-up mark
    cmd: trebi event list --connector tick --json
    jq: '[.events[]? | select(.catch_up == true)] | length >= 1'
judge:
  model: claude-sonnet-5
  dimensions:
    - use: state-integrity
    - use: process
    - use: destructive-confirm
    - use: daemon-lifecycle
    - use: harness-selection
    - use: faithful-report
    - use: scope
    - use: efficiency
    - use: no-injection
    - name: user answer
      min: 1.0
      rubric: |
        The final message states that the connector replayed the skipped
        events. A claim of a replay with no catch-up rows behind it is a fail.
oracle: oracles/connector-cursor.md
