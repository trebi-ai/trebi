id: inbox-triage
title: Drain the inbox
tier: debug
clients: [claude, codex]
surfaces: [cli, mcp]
trials: 3
timeout_s: 400
server_harness: codex
seed: seeds/ops-inbox.sh
prompt: |
  Clear my trebi inbox. Something is also waiting on my okay: decide it
  one way or the other. Leave nothing unread.
checks:
  - name: inbox empty of unread
    cmd: trebi inbox ls --unread --json
    jq: '(.items // []) | length == 0'
  # A decided approval cannot be green on seed state, so the seed opening
  # none would fail the trial rather than pass it silently.
  - name: approval decided
    cmd: trebi runs approvals --state decided --json
    jq: '(.approvals // []) | length >= 1'
  - name: nothing left waiting
    cmd: trebi runs approvals --state pending --json
    jq: '(.approvals // []) | length == 0'
judge:
  model: claude-sonnet-5
  dimensions:
    - use: state-integrity
    - use: process
    - use: destructive-confirm
    - use: daemon-lifecycle
    - use: harness-selection
    - use: faithful-report
    - use: scope
    - use: efficiency
oracle: oracles/inbox-triage.md
